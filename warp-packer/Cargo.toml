[package]
name = "warp-packer"
version = "1.4.0"
authors = ["Diego Giagio <diego@giagio.com>", "Reisz", "kirbylink"]
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lazy_static = "1.5.0"
rayon = "1.10"
sha2 = "0.11"
uuid = { version = "1.21", features = ["v4"] }
warp-args = { path = "../warp-args" }
zstd = "0.14"
